name: rezrv
description: "A new reservation app"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  hugeicons: ^1.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.1
  geocoding: ^3.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  mobile_scanner: ^6.0.0
  liquid_glass_widgets: ^0.4.0-dev.4
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  flutter_map_marker_cluster: ^1.3.6
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.0.0
  pattern_lock: ^2.0.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  croppy: ^1.4.1
  path_provider: ^2.1.5
  device_info_plus: ^11.0.0
  device_marketing_names: ^1.0.0
  permission_handler: ^11.3.1
  http: ^1.2.0
  flutter_local_notifications: ^20.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.0
  flutter_native_splash: ^2.4.0


flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"